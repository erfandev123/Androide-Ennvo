name: ennvo
description: "Ennvo - fast social app for reels, stories, chat and HD calls."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State
  flutter_riverpod: ^3.5.0

  # Networking
  http: ^1.2.2

  # The signature of the Cloudflare R2 uploads.
  crypto: ^3.0.6

  # Media
  cached_network_image: ^4.0.7
  video_player: ^2.14.1

  # Voice notes - the recorder of the comment composer.
  record: ^7.2.0

  # Playing the voice notes of the comments and the chat.
  audioplayers: ^6.1.0

  # The camera and the photo picker of the composer.
  image_picker: ^1.1.2

  # The live camera: preview, photo and smooth video recording.
  camera: ^0.12.2

  # Icons — the SVG renderer keeps the original Lucide and custom icon
  # markup, so the native build draws the same glyphs as the web build.
  flutter_svg: ^2.4.0

  # Firebase — the app reuses the existing Ennvo project.
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_database: ^13.0.1
  firebase_storage: ^14.0.1
  firebase_messaging: ^17.0.1

  # Local storage
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/fonts/
    - assets/demo/reels/r1.jpg
    - assets/demo/reels/r2.jpg
    - assets/demo/reels/r3.jpg
    - assets/demo/reels/r4.jpg
    - assets/demo/reels/r1.mp4
    - assets/demo/reels/r2.mp4
    - assets/demo/reels/r3.mp4
    - assets/demo/reels/r4.mp4

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-600.ttf
          weight: 600
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
        - asset: assets/fonts/Outfit-800.ttf
          weight: 800
        - asset: assets/fonts/Outfit-900.ttf
          weight: 900
    # Plus Jakarta Sans ships weights 200-800 only — there is no Black/900 in
    # the family, so the browser silently falls back to the 800 face for any
    # `font-weight: 900` request. The Flutter port does the same.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
