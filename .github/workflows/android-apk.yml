name: Android APK

# The APK is built entirely on GitHub's runners — nothing is compiled on
# the developer's machine. The result is attached to the run as an
# artifact, and a tagged build also publishes a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Set up the Android project
        run: bash tooling/setup_android.sh

      - name: Fetch dependencies
        run: flutter pub get

      # --- signing ------------------------------------------------------
      # The keystore is stored as a base64 secret so it never lands in the
      # repository. When the secrets are absent the build still runs and
      # produces an unsigned (debug-key) APK.
      - name: Restore keystore
        id: keystore
        continue-on-error: true
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret — building with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Decode version
        id: version
        run: |
          VERSION_NAME=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          VERSION_CODE=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # --- build --------------------------------------------------------
      - name: Build release APKs
        if: ${{ inputs.build_type != 'debug' }}
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --build-name "ennvo-${{ steps.version.outputs.name }}.apk" \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: flutter build apk --debug

      # --- artifact -----------------------------------------------------
      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find build/app/outputs/flutter-apk -name '*.apk' -exec cp {} apk-output/ \;
          ls -lh apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ennvo-apk-${{ steps.version.outputs.name }}
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

      # --- release ------------------------------------------------------
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          generate_release_notes: true
          body: |
            Ennvo ${{ steps.version.outputs.name }} (version code ${{ steps.version.outputs.code }})

            | File | Target |
            | --- | --- |
            | `app-arm64-v8a-release.apk` | Modern 64-bit phones |
            | `app-armeabi-v7a-release.apk` | Older 32-bit phones |
            | `app-x86_64-release.apk` | Emulators |
